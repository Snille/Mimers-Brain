# Pinned so the project name - and therefore the volume name
# mimers-valv_valv-data holding every thought - stays put no matter what the
# checkout directory is called. Compose otherwise derives it from the folder,
# and a rename would silently create a fresh, empty database.
name: mimers-valv

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: valv-db
    restart: unless-stopped
    # Required inside an unprivileged Proxmox LXC: the container cannot apply an
    # AppArmor profile. Harmless elsewhere. See README "Docker i LXC".
    security_opt:
      - apparmor=unconfined
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt POSTGRES_PASSWORD i .env}
      POSTGRES_DB: ${POSTGRES_DB:-valv}
    volumes:
      - valv-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mimer} -d ${POSTGRES_DB:-valv}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./server
    image: mimers-valv:latest
    container_name: valv-app
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mimer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-valv}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY:-}
      MCP_OPEN_KEY: ${MCP_OPEN_KEY:-}
      CITATION_BASE_URL: ${CITATION_BASE_URL:-http://localhost:8790/thoughts}
      # Shown by the Connect page. PUBLIC_URL falls back to CITATION_BASE_URL
      # without its path. LAN_URL is normally empty - the server learns its own
      # LAN address from visits to the LAN listener - and only overrides it.
      PUBLIC_URL: ${PUBLIC_URL:-}
      LAN_URL: ${LAN_URL:-}
      # Browser origins allowed to call /openapi.json and /tools/* - an OpenAPI
      # tool server in Open WebUI needs the page's own origin listed here.
      # Comma separated, scheme and port included. Empty means no browser on
      # another origin may call it, which is the right default.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Statistics. The timezone decides where a day and a month break.
      STATS_TZ: ${STATS_TZ:-Europe/Stockholm}
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-730}
      # MQTT to Home Assistant. Leave MQTT_URL empty to publish nothing.
      MQTT_URL: ${MQTT_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-mimersbrain}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-homeassistant}
      MQTT_INTERVAL_S: ${MQTT_INTERVAL_S:-60}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-}
      PORT_FULL: 8790
      PORT_OPEN: 8791
    ports:
      # FULL - open + vault + dashboard. Keep this on the LAN only.
      - "8790:8790"
      # OPEN - the only port Nginx Proxy Manager should ever forward to.
      - "8791:8791"

volumes:
  valv-data:
