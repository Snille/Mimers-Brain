# brain.example.net -> Mimers Brain (open tier only, 192.0.2.41:8791)
#
# Goes in Nginx Proxy Manager under "Custom Nginx Configuration" (the gear icon
# on Edit Proxy Host - NOT the tab labelled "Advanced"). The proxy host's own
# forward target must be port 8791. Never 8790: that listener serves the vault.

# ---- Authelia auth_request ----
set $upstream_authelia http://192.0.2.34:9091/api/authz/auth-request;
set $upstream_valv     http://192.0.2.41:8791;

location /authelia {
    internal;
    proxy_pass $upstream_authelia;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Forwarded-Method $request_method;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# ---- OAuth discovery: say no, clearly ----
# MCP clients probe for OAuth metadata before they ever send JSON-RPC. Falling
# through to `location /` these paths answer 302 to the login page, which then
# answers 200 - so the client concludes an authorization server exists here,
# tries to register with it, and fails with a sign-in error. There is no OAuth
# on this server; a clean 404 says so, and the client falls back to the URL it
# was given. Regex, so it is matched before the prefix `location /` below.
# Scoped to the OAuth paths only, leaving /.well-known/acme-challenge alone.
location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration) {
    access_log off;
    return 404;
}

# ---- MCP endpoint ----
# Deliberately NOT behind Authelia: MCP clients (Claude, ChatGPT, Gemini) send a
# bearer token and cannot complete an interactive login. Behind auth_request the
# 401 would become a 302 to the login page and the client would get HTML back
# instead of JSON-RPC. The app verifies MCP_ACCESS_KEY itself, and this listener
# physically cannot reach vault rows.
location /mcp {
    # MCP_OPEN_KEY may arrive as ?key= for clients that cannot send a header.
    # Logging every request would write that key to disk on each call, so this
    # endpoint is silent. Health and the UI still log normally.
    access_log off;

    proxy_pass $upstream_valv;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # MCP Streamable HTTP keeps an SSE stream open - nginx must not buffer it.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 10m;
}

# ---- OpenAPI tool server ----
# Same reasoning as /mcp: a tool server (Open WebUI and its kind) authenticates
# with a bearer token and cannot complete an interactive login, so behind
# auth_request it would receive the login page's HTML instead of JSON. The app
# checks MCP_ACCESS_KEY itself on /tools/*, and this listener cannot reach vault
# rows. /openapi.json is deliberately open - it is tool names and argument
# schemas, nothing a reader could not find in the public repo.
#
# No `add_header Access-Control-*` here: the app emits CORS headers itself, for
# the origins listed in CORS_ORIGINS, and adding a second set would produce a
# duplicate header that browsers reject outright.
location ~ ^/(openapi\.json|tools/) {
    proxy_pass $upstream_valv;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    client_max_body_size 10m;
}

# ---- Health check ----
# Unauthenticated so uptime monitoring works. Returns only {"ok":true,"tier":"open"}.
location = /healthz {
    proxy_pass $upstream_valv;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    access_log off;
}

# ---- Everything else (the web UI) ----
location / {
    auth_request /authelia;
    auth_request_set $user $upstream_http_remote_user;
    auth_request_set $groups $upstream_http_remote_groups;
    auth_request_set $name $upstream_http_remote_name;
    auth_request_set $email $upstream_http_remote_email;

    proxy_set_header Remote-User $user;
    proxy_set_header Remote-Groups $groups;
    proxy_set_header Remote-Name $name;
    proxy_set_header Remote-Email $email;

    error_page 401 =302 https://auth.example.net/?rd=$scheme://$http_host$request_uri;

    proxy_pass $upstream_valv;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 10m;
}
