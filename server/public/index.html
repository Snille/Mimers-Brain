<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mimers Brain</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2330; --line: #2a3441;
    --ink: #e6edf3; --muted: #8b98a9; --accent: #4aa3c7; --accent-dim: #2d6c87;
    --warn: #d98b4a; --danger: #cf5b5b; --ok: #5bbf8a;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f8; --panel: #ffffff; --panel-2: #eef2f6; --line: #d8e0e8;
      --ink: #17212b; --muted: #5f6f80; --accent: #1f6f92; --accent-dim: #a8cbdb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .logo {
    width: 36px; height: 36px; flex: none; display: block;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .35));
  }
  .logo-lg { width: 62px; height: 62px; }
  h1 { margin: 0; font-size: 19px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  main { display: grid; grid-template-columns: 250px 1fr; gap: 0; min-height: calc(100vh - 62px); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { border-right: none !important; } }

  aside { border-right: 1px solid var(--line); padding: 18px; background: var(--panel); }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 20px 0 8px; }
  aside h2:first-child { margin-top: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    padding: 3px 9px; border-radius: 999px; font-size: 12.5px; margin: 0 5px 5px 0;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip b { color: var(--muted); font-weight: 500; }
  .chip.on b { color: #dbeef7; }

  section.content { padding: 18px 22px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  input[type=search], input[type=text], textarea, select {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: var(--radius); padding: 9px 12px; font: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  input[type=search] { flex: 1; min-width: 220px; }
  textarea { width: 100%; resize: vertical; line-height: 1.5; }
  button {
    background: var(--accent); color: #fff; border: 1px solid transparent;
    border-radius: var(--radius); padding: 9px 15px; font: inherit; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  button.ghost:hover { border-color: var(--accent); filter: none; }
  button.danger { background: var(--danger); }
  button:disabled { opacity: .5; cursor: default; filter: none; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 12.5px; color: var(--muted); }
  .tag { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; }
  .tag.type { color: var(--accent); border-color: var(--accent-dim); }
  .tag.sim { color: var(--ok); border-color: var(--ok); }
  .tag.vault { color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .card.vault { border-left: 3px solid var(--warn); }
  .card .body { white-space: pre-wrap; word-break: break-word; }
  .editfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 12px; }
  .editfields input, .editfields select { width: 100%; }
  .card .actions { margin-top: 10px; display: none; gap: 8px; }
  .card:hover .actions, .card.editing .actions { display: flex; }
  .empty { color: var(--muted); text-align: center; padding: 50px 0; }
  .err { background: #40201f; border: 1px solid var(--danger); color: #ffd9d7; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 14px; }
  @media (prefers-color-scheme: light) { .err { background: #fdecec; color: #7a2320; } }
  .stat { font-size: 12.5px; color: var(--muted); }

  /* --- navigation between the three views --- */
  nav { display: flex; gap: 4px; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font-size: 13.5px;
  }
  nav button:hover { color: var(--ink); filter: none; }
  nav button.on { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
  #language { padding: 6px 10px; border-radius: 999px; font-size: 13px; }
  .page { display: none; }
  .page.on { display: block; }
  /* main is display:grid above, which would beat a plain [hidden], so it needs
     its own rule rather than sharing .page's. */
  main:not(.on) { display: none; }

  /* --- connect + stats --- */
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card p { margin: 0 0 12px; }
  code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  pre {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin: 0; overflow-x: auto;
  }
  pre code { white-space: pre; }
  .snip { margin-bottom: 12px; }
  .snip:last-child { margin-bottom: 0; }
  .snip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; font-size: 12.5px; color: var(--muted); }
  .snip-note { margin-top: 6px; }
  button.small { padding: 3px 9px; font-size: 12px; border-radius: 7px; }
  .keyval { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; }
  table.grid { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  table.grid th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; }
  table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 7px 10px 7px 0; vertical-align: top; }
  table.grid tr:last-child td { border-bottom: none; }
  .bad { color: var(--danger); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
  .dot.ok { background: var(--ok); }
  .dot.danger { background: var(--danger); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kpi-v { font-size: 26px; font-weight: 600; line-height: 1.15; }
  .kpi-l { font-size: 12.5px; color: var(--muted); }
  .kpi-s { font-size: 12px; color: var(--muted); opacity: .8; margin-top: 3px; }
  .chart { width: 100%; height: 130px; display: block; }
  .chart-axis { display: flex; align-items: center; gap: 12px; margin-top: 5px; }
  .chart-axis .legend { flex: 1; display: flex; align-items: center; gap: 10px; }
  .chart-axis .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  dialog {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 12px; padding: 20px; width: min(680px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; }
</style>
</head>
<body>
<header>
  <img src="/icon-180.png" alt="" class="logo" />
  <h1>Mimers <span>Brain</span></h1>
  <div class="sub" id="hostinfo"></div>
  <nav>
    <button data-view="thoughts" class="on" data-i18n="nav.thoughts">Thoughts</button>
    <button data-view="stats" data-i18n="nav.statistics">Statistics</button>
    <button data-view="connect" data-i18n="nav.connect">Connect</button>
  </nav>
  <div class="grow"></div>
  <select id="language" data-i18n-aria-label="app.language" aria-label="Language"></select>
  <div class="sub stat" id="headstat"></div>
  <button id="new" data-i18n="header.newThought">+ New thought</button>
</header>

<main class="on" id="view-thoughts">
  <aside>
    <h2 data-i18n="filters.type">Type</h2><div id="f-types"></div>
    <h2 data-i18n="filters.topics">Topics</h2><div id="f-topics"></div>
    <h2 data-i18n="filters.people">People</h2><div id="f-people"></div>
  </aside>

  <section class="content">
    <div class="bar">
      <input type="search" id="q" placeholder="Search …" data-i18n-placeholder="search.placeholder" autocomplete="off" />
      <select id="mode">
        <option value="text" data-i18n="search.text">Text search</option>
        <option value="semantic" data-i18n="search.semantic">Semantic</option>
      </select>
      <button class="ghost" id="clear" data-i18n="search.clear">Clear</button>
    </div>
    <div id="error"></div>
    <div id="list"></div>
  </section>
</main>

<section class="content page" id="view-stats"></section>
<section class="content page" id="view-connect"></section>

<dialog id="login">
  <div style="display:flex; align-items:center; gap:14px; margin-bottom:6px">
    <img src="/icon-180.png" alt="" class="logo logo-lg" />
    <div>
      <h3 style="margin:0 0 3px" data-i18n="login.title">Unlock Mimers Brain</h3>
      <div class="sub" data-i18n="login.description">Paste the access key. It is exchanged for a cookie that remains in this browser, so you only do this once.</div>
    </div>
  </div>
  <label for="login-key" data-i18n="login.key">Access key</label>
  <input type="password" id="login-key" style="width:100%" autocomplete="current-password" />
  <div id="login-err" class="sub" style="color:var(--danger); min-height:18px"></div>
  <div style="display:flex; justify-content:flex-end; margin-top:14px">
    <button id="login-go" data-i18n="login.unlock">Unlock</button>
  </div>
</dialog>

<dialog id="dlg">
  <h3 style="margin:0 0 4px" data-i18n="editor.newTitle">New thought</h3>
  <div class="sub" data-i18n="editor.description">Write it as a standalone statement that any AI can understand much later without the original context.</div>
  <label for="dlg-text" data-i18n="editor.content">Content</label>
  <textarea id="dlg-text" rows="8"></textarea>
  <label for="dlg-type" data-i18n="editor.type">Type</label>
  <select id="dlg-type">
    <option value="observation">observation</option>
    <option value="reference">reference</option>
    <option value="project">project</option>
    <option value="task">task</option>
    <option value="idea">idea</option>
    <option value="person_note">person_note</option>
  </select>
  <label for="dlg-tier" data-i18n="editor.tier">Tier</label>
  <select id="dlg-tier">
    <option value="open" data-i18n="tiers.openOption">Open — also available remotely</option>
    <option value="vault" data-i18n="tiers.vaultOption">🔒 Vault — keys and passwords never leave the LAN</option>
  </select>
  <label for="dlg-topics" data-i18n="editor.topics">Topics (comma-separated)</label>
  <input type="text" id="dlg-topics" placeholder="network, proxmox" data-i18n-placeholder="editor.topicsPlaceholder" />
  <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:18px">
    <button class="ghost" id="dlg-cancel" data-i18n="editor.cancel">Cancel</button>
    <button id="dlg-save" data-i18n="editor.save">Save</button>
  </div>
</dialog>

<script type="module">
import {
  availableLanguages, chooseLanguage, currentLanguage, formatDate, initI18n, t as tr,
} from "./i18n.mjs";

await initI18n();

const $ = (s) => document.querySelector(s);
const state = { filters: {}, mode: "text", q: "", semantic: false };
const TYPES = ["observation", "reference", "project", "task", "idea", "person_note"];

for (const item of availableLanguages()) {
  const option = document.createElement("option");
  option.value = item.code;
  option.textContent = item.name;
  option.selected = item.code === currentLanguage();
  $("#language").appendChild(option);
}
$("#language").onchange = (event) => chooseLanguage(event.target.value);

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (d) => formatDate(d);

function showError(msg) {
  $("#error").innerHTML = msg ? `<div class="err">${esc(msg)}</div>` : "";
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

function chips(container, entries, key) {
  const el = $(container);
  el.innerHTML = "";
  for (const [name, count] of entries) {
    const b = document.createElement("button");
    b.className = "chip" + (state.filters[key] === name ? " on" : "");
    b.innerHTML = `${esc(name)} <b>${count}</b>`;
    b.onclick = () => {
      state.filters[key] = state.filters[key] === name ? undefined : name;
      refresh();
    };
    el.appendChild(b);
  }
  if (!entries.length) el.innerHTML = '<span class="sub">–</span>';
}

function card(t) {
  const m = t.metadata || {};
  const el = document.createElement("div");
  el.className = "card";
  if (t.tier === "vault") el.classList.add("vault");
  const tags = [
    t.tier === "vault" ? `<span class="tag vault">🔒 ${esc(tr("tiers.vault"))}</span>` : "",
    m.type ? `<span class="tag type">${esc(m.type)}</span>` : "",
    ...(m.topics || []).map((x) => `<span class="tag">${esc(x)}</span>`),
    ...(m.people || []).map((x) => `<span class="tag">👤 ${esc(x)}</span>`),
    t.similarity != null ? `<span class="tag sim">${(t.similarity * 100).toFixed(0)}%</span>` : "",
  ].join("");

  el.innerHTML = `
    <div class="meta">${tags}<span class="grow"></span><span>${fmt(t.created_at)}</span></div>
    <div class="body">${esc(t.content)}</div>
    <div class="actions">
      <button class="ghost edit">${esc(tr("thought.edit"))}</button>
      <button class="ghost danger del">${esc(tr("thought.delete"))}</button>
    </div>`;

  el.querySelector(".edit").onclick = () => {
    if (el.classList.contains("editing")) return;
    el.classList.add("editing");
    const body = el.querySelector(".body");
    const ta = document.createElement("textarea");
    ta.rows = Math.max(4, Math.ceil(t.content.length / 90) + 1);
    ta.value = t.content;
    body.replaceWith(ta);

    // Tags are edited as plain comma-separated text. It round-trips exactly what
    // the sidebar shows, which is what makes merging two spellings of the same
    // topic - or of the same person - a ten-second job.
    const types = !m.type || TYPES.includes(m.type) ? TYPES : [m.type, ...TYPES];
    const fields = document.createElement("div");
    fields.className = "editfields";
    fields.innerHTML = `
      <label>${esc(tr("editor.type"))}<select class="e-type">${types
        .map((x) => `<option${x === m.type ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></label>
      <label>${esc(tr("editor.topics"))}<input class="e-topics" value="${esc((m.topics || []).join(", "))}" /></label>
      <label>${esc(tr("editor.people"))}<input class="e-people" value="${esc((m.people || []).join(", "))}" /></label>`;
    ta.after(fields);

    const acts = el.querySelector(".actions");
    acts.innerHTML = "";
    const save = document.createElement("button");
    save.textContent = tr("editor.save");
    const cancel = document.createElement("button");
    cancel.className = "ghost";
    cancel.textContent = tr("editor.cancel");
    acts.append(save, cancel);
    cancel.onclick = refresh;
    save.onclick = async () => {
      save.disabled = true;
      save.textContent = tr("editor.saving");
      try {
        const list = (sel) =>
          fields.querySelector(sel).value.split(",").map((s) => s.trim()).filter(Boolean);
        // PATCH replaces metadata wholesale, so spread the existing object to
        // keep keys the form does not show (source, and anything added later).
        const payload = {
          metadata: {
            ...m,
            type: fields.querySelector(".e-type").value,
            topics: list(".e-topics"),
            people: list(".e-people"),
          },
        };
        // Only send content when it actually changed - the server re-embeds
        // whenever it sees the field, and that is a paid API call.
        if (ta.value !== t.content) payload.content = ta.value;
        await api(`/api/thoughts/${t.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        refresh();
      } catch (e) { showError(e.message); save.disabled = false; save.textContent = tr("editor.save"); }
    };
  };

  el.querySelector(".del").onclick = async () => {
    if (!confirm(tr("thought.confirmDelete"))) return;
    try {
      await api(`/api/thoughts/${t.id}`, { method: "DELETE" });
      refresh();
    } catch (e) { showError(e.message); }
  };

  return el;
}

async function refresh() {
  showError("");
  const list = $("#list");
  try {
    let rows;
    if (state.mode === "semantic" && state.q) {
      rows = await api("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: state.q, limit: 40 }),
      });
    } else {
      const p = new URLSearchParams();
      if (state.q) p.set("q", state.q);
      for (const [k, v] of Object.entries(state.filters)) if (v) p.set(k, v);
      rows = await api(`/api/thoughts?${p}`);
    }

    list.innerHTML = "";
    if (!rows.length) {
      list.innerHTML = `<div class="empty">${esc(tr("search.noMatches"))}</div>`;
    } else {
      for (const t of rows) list.appendChild(card(t));
    }
    $("#headstat").textContent = tr("header.shown", { shown: rows.length });

    const s = await api("/api/stats");
    const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
    chips("#f-types", top(s.types, 12), "type");
    chips("#f-topics", top(s.topics, 25), "topic");
    chips("#f-people", top(s.people, 15), "person");
    const tierBits = Object.entries(s.byTier || {}).map(([k, v]) => `${tr(`tiers.${k}`)} ${v}`).join(" · ");
    $("#headstat").textContent = `${tr("header.shownOf", { shown: rows.length, total: s.total })}${tierBits ? ` (${tierBits})` : ""}`;
  } catch (e) {
    showError(e.message);
    list.innerHTML = "";
  }
}

// wiring
let timer;
$("#q").oninput = (e) => {
  state.q = e.target.value.trim();
  clearTimeout(timer);
  timer = setTimeout(refresh, state.mode === "semantic" ? 550 : 220);
};
$("#mode").onchange = (e) => { state.mode = e.target.value; if (state.q) refresh(); };
$("#clear").onclick = () => { state.q = ""; state.filters = {}; $("#q").value = ""; refresh(); };

$("#new").onclick = () => { $("#dlg-text").value = ""; $("#dlg-topics").value = ""; $("#dlg").showModal(); $("#dlg-text").focus(); };
$("#dlg-cancel").onclick = () => $("#dlg").close();
$("#dlg-save").onclick = async () => {
  const content = $("#dlg-text").value.trim();
  if (!content) return;
  const btn = $("#dlg-save");
  btn.disabled = true; btn.textContent = tr("editor.saving");
  try {
    const topics = $("#dlg-topics").value.split(",").map((s) => s.trim()).filter(Boolean);
    await api("/api/thoughts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content,
        tier: $("#dlg-tier").value,
        metadata: { type: $("#dlg-type").value, topics },
      }),
    });
    $("#dlg").close();
    refresh();
  } catch (e) { showError(e.message); }
  finally { btn.disabled = false; btn.textContent = tr("editor.save"); }
};

async function unlock() {
  const btn = $("#login-go");
  btn.disabled = true;
  try {
    await api("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: $("#login-key").value.trim() }),
    });
    $("#login").close();
    refresh();
  } catch (e) {
    $("#login-err").textContent = e.message;
  } finally { btn.disabled = false; }
}
$("#login-go").onclick = unlock;
$("#login-key").onkeydown = (e) => { if (e.key === "Enter") unlock(); };

// Views. Statistics and Connect are loaded the first time they are opened -
// there is no reason to fetch either just because someone came to read a memory.
const views = {
  stats: { el: "#view-stats", mod: "./stats.mjs", loaded: false },
  connect: { el: "#view-connect", mod: "./connect.mjs", loaded: false },
};

async function show(name) {
  for (const b of document.querySelectorAll("nav button"))
    b.classList.toggle("on", b.dataset.view === name);
  $("#view-thoughts").classList.toggle("on", name === "thoughts");
  $("#new").style.display = name === "thoughts" ? "" : "none";
  $("#headstat").style.display = name === "thoughts" ? "" : "none";

  for (const [key, v] of Object.entries(views)) {
    const el = $(v.el);
    el.classList.toggle("on", key === name);
    if (key !== name) continue;
    try {
      // Re-rendered on every visit, so the numbers are never stale; the module
      // itself is only fetched once.
      const m = await import(v.mod);
      v.loaded = true;
      await m.render(el);
    } catch (e) {
      el.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  }
  location.hash = name === "thoughts" ? "" : name;
}

for (const b of document.querySelectorAll("nav button"))
  b.onclick = () => show(b.dataset.view);

const cfg = await api("/api/config").catch(() => ({}));
$("#hostinfo").textContent =
  tr(cfg.vault ? "header.fullAccess" : "header.openOnly") + (cfg.version ? ` · ${cfg.version}` : "");
if (!cfg.vault) $("#dlg-tier").querySelector('[value=vault]').disabled = true;

if (cfg.authed === false) {
  $("#login").showModal();
  $("#login-key").focus();
} else {
  refresh();
  const start = location.hash.slice(1);
  if (views[start]) show(start);
}
</script>
</body>
</html>
